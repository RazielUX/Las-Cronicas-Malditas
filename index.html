<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Las Crónicas Malditas — cuenta regresiva a Halloween y revelación de historias malditas desde tu canal." />

    <title>Las Crónicas Malditas — Cuenta Regresiva a Halloween</title>

    <!-- Preconnect / Prefetch para rendimiento -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

    <style>
        :root{
            --bg-1: #0a0a0a;
            --bg-2: #1a0a0a;
            --accent-1: #ff0040;
            --accent-2: #ff6600;
            --muted: #b8a992;
            --bord: #8b0000;
            --glass: rgba(10,10,10,0.6);
            --card-dark: linear-gradient(145deg,#1a0505,#0a0a0a);
            --shadow-strong: 0 20px 60px rgba(0,0,0,0.9);
        }

        /* Reset moderno */
        *,*::before,*::after{box-sizing:border-box}
        html,body{height:100%}
        body{
            margin:0;
            font-family:'IM Fell English', serif;
            background: linear-gradient(135deg,var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-1) 100%);
            color: #e8d5c4;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
            min-height:100vh;
            position:relative;
            overflow-x:hidden;
        }

        /* sutil overlay de color */
        body::before{
            content:"";
            position:fixed; inset:0;
            background:
                radial-gradient(circle at 20% 50%, rgba(139,0,0,0.06) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(74,123,167,0.06) 0%, transparent 45%);
            pointer-events:none;
            z-index:0;
        }

        .container{
            max-width:1200px;
            margin:0 auto;
            padding:2rem;
            position:relative;
            z-index:1;
        }

        /* Header */
        header.header{
            text-align:center;
            margin-bottom:2.5rem;
            animation:fadeInDown .9s ease-out both;
        }
        .logo{
            font-family:'Creepster',cursive;
            color:var(--accent-1);
            font-size:clamp(2.2rem,8vw,4.6rem);
            text-shadow:
                0 0 20px rgba(255,0,64,0.85),
                0 0 40px rgba(139,0,0,0.6),
                3px 3px 6px rgba(0,0,0,0.9);
            letter-spacing:3px;
            margin-bottom:.5rem;
        }
        .tagline{
            font-size:clamp(1rem,2.6vw,1.25rem);
            color:var(--muted);
            font-style:italic;
            text-shadow:2px 2px 4px rgba(0,0,0,0.8);
        }

        /* Countdown */
        .countdown-section{
            background:var(--glass);
            border:3px solid var(--bord);
            border-radius:20px;
            padding:1.6rem;
            margin-bottom:2.5rem;
            box-shadow: 0 0 30px rgba(139,0,0,0.32), inset 0 0 20px rgba(0,0,0,0.45);
            animation:fadeIn .9s ease-out both;
        }
        .countdown-title{
            font-family:'Creepster',cursive;
            color:var(--accent-2);
            font-size:clamp(1.4rem,4vw,2.6rem);
            text-align:center;
            margin-bottom:1.4rem;
            text-shadow:0 0 15px rgba(255,102,0,0.75);
        }
        .countdown-timer{
            display:flex;
            justify-content:center;
            gap:1.2rem;
            flex-wrap:wrap;
        }
        .time-unit{
            background:var(--card-dark);
            border:2px solid var(--bord);
            border-radius:12px;
            padding:1.2rem .9rem;
            min-width:100px;
            text-align:center;
            box-shadow: 0 8px 18px rgba(0,0,0,0.6), inset 0 2px 12px rgba(139,0,0,0.3);
            transition: transform .24s ease, box-shadow .24s ease;
        }
        .time-unit:hover{ transform:translateY(-6px); box-shadow: 0 16px 36px rgba(139,0,0,0.45); }
        .time-value{
            display:block;
            font-family:'Creepster',cursive;
            color:var(--accent-1);
            font-size:clamp(2rem,5.2vw,3.6rem);
            text-shadow: 0 0 20px rgba(255,0,64,0.9), 0 0 40px rgba(139,0,0,0.6);
            margin-bottom:.3rem;
            line-height:1;
        }
        .time-label{
            display:block;
            font-size:.94rem;
            color:var(--muted);
            text-transform:uppercase;
            letter-spacing:1.6px;
        }

        /* Book animation (mejor accesible y activable por teclado) */
        .book-animation{ width:320px; height:320px; margin:2.25rem auto; position:relative; animation:fadeIn .9s ease-out both; }
        .book{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; position:relative; }
        .book-cover{
            width:190px; height:260px;
            background: linear-gradient(145deg,#2d1810,#1a0f08);
            border:4px solid #8b4513;
            border-radius:8px;
            display:flex; align-items:center; justify-content:center;
            position:relative; cursor:pointer; transition:transform .3s ease; box-shadow:
            0 10px 40px rgba(0,0,0,0.85), 0 20px 60px rgba(255,0,64,0.45), inset 0 0 40px rgba(139,0,0,0.45);
            outline: none;
        }
        .book-cover:focus{ box-shadow: 0 20px 60px rgba(255,0,64,0.6), 0 10px 40px rgba(0,0,0,0.95); transform: translateY(-4px) scale(1.02); }
        .book-cover.opening{ animation:bookOpen 1.4s ease-out forwards; }
        @keyframes bookOpen{
            0%{ transform:rotateY(0deg); }
            50%{ transform:rotateY(-95deg); }
            100%{ transform:rotateY(-180deg); opacity:0; transform-origin:center; }
        }
        .book-title{ font-family:'Creepster',cursive; font-size:1.8rem; color:var(--accent-1); text-align:center; text-shadow:0 0 10px rgba(255,0,64,0.8); padding:1rem; }
        .skulls{ position:absolute; font-size:2.6rem; opacity:.28; pointer-events:none; }
        .skull-1{ top:6%; left:8%; animation:skullFloat 3.2s ease-in-out infinite; }
        .skull-2{ top:6%; right:8%; animation:skullFloat 3.2s ease-in-out infinite .6s; }
        .skull-3{ bottom:8%; left:8%; animation:skullFloat 3.2s ease-in-out infinite 1.1s; }
        .skull-4{ bottom:8%; right:8%; animation:skullFloat 3.2s ease-in-out infinite 1.6s; }
        @keyframes skullFloat{ 0%,100%{ transform:translateY(0) rotate(0deg);} 50%{ transform:translateY(-12px) rotate(4deg);} }

        /* CTA */
        .cta-section{ margin:2.4rem 0; animation:fadeInUp .9s ease-out both; text-align:center; }
        .cta-text{ text-align:center; font-size:clamp(1.05rem,3.2vw,1.6rem); color:#e8d5c4; margin-bottom:1.2rem; font-style:italic; text-shadow:2px 2px 6px rgba(0,0,0,0.9); }
        .cta-button{
            font-family:'Creepster',cursive;
            display:inline-block;
            background:linear-gradient(145deg,#8b0000,#ff0040);
            color:#fff; border:3px solid var(--accent-1); border-radius:50px;
            padding:1.1rem 2.2rem; font-size:clamp(1rem,3.4vw,1.6rem); cursor:pointer;
            box-shadow:0 10px 30px rgba(255,0,64,0.4), inset 0 -5px 15px rgba(0,0,0,0.45);
            text-transform:uppercase; letter-spacing:1.6px; transition:transform .24s ease, box-shadow .24s ease;
            position:relative;
        }
        .cta-button:focus{ outline:3px solid rgba(255,0,64,0.25); }
        .cta-button::before{ content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:0;height:0;border-radius:50%; background:rgba(255,255,255,0.12); transition:width .5s,height .5s; }
        .cta-button:hover{ transform:translateY(-6px) scale(1.02); box-shadow:0 15px 40px rgba(255,0,64,0.5); }
        .cta-button:hover::before{ width:280px;height:280px; }

        /* Video */
        .video-section{ display:none; animation:fadeInUp .8s ease-out; margin-top:1.6rem; }
        .video-section.active{ display:block; }
        .video-container{ position:relative; width:100%; max-width:900px; margin:0 auto 1.2rem; background:#000; border:4px solid var(--accent-1); border-radius:18px; overflow:hidden; box-shadow:0 0 40px rgba(255,0,64,0.5), var(--shadow-strong); }
        .video-inner{ width:100%; height:0; padding-bottom:56.25%; position:relative; }
        #player{ position:absolute; inset:0; width:100%; height:100%; }
        .video-controls{ display:flex; gap:.8rem; justify-content:center; flex-wrap:wrap; }

        .secondary-button{
            font-family:'IM Fell English',serif;
            background:rgba(74,123,167,0.18); color:#4a7ba7; border:2px solid #4a7ba7;
            padding:.9rem 1.6rem; border-radius:30px; cursor:pointer; text-transform:uppercase; letter-spacing:1px;
            transition:all .22s ease;
        }
        .secondary-button:hover{ transform:translateY(-4px); background:rgba(74,123,167,0.34); box-shadow:0 10px 20px rgba(74,123,167,0.18); }

        /* Loading */
        .loading{ text-align:center; color:var(--accent-1); font-size:1.1rem; padding:1.2rem; animation:pulse 1.5s ease-in-out infinite; }
        @keyframes pulse{ 0%,100%{ opacity:.6 } 50%{ opacity:1 } }

        /* Animations */
        @keyframes fadeInDown{ from{ opacity:0; transform:translateY(-22px)} to{ opacity:1; transform:none }}
        @keyframes fadeInUp{ from{ opacity:0; transform:translateY(22px)} to{ opacity:1; transform:none }}
        @keyframes fadeIn{ from{ opacity:0 } to{ opacity:1 } }

        /* Responsive */
        @media (max-width:768px){
            .time-unit{ min-width:84px; padding:.9rem .6rem; }
            .book-animation{ width:260px; height:260px; }
            .book-cover{ width:160px; height:220px; }
        }

        /* Respect user motion preferences */
        @media (prefers-reduced-motion: reduce){
            * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header" role="banner">
            <h1 class="logo">Las Crónicas Malditas</h1>
            <p class="tagline">Donde las historias oscuras cobran vida...</p>
        </header>

        <main id="main" role="main" aria-live="polite">
            <!-- Countdown -->
            <section class="countdown-section" aria-labelledby="countdownTitle">
                <h2 id="countdownTitle" class="countdown-title">🎃 Cuenta Regresiva a Halloween 🎃</h2>
                <div class="countdown-timer">
                    <div class="time-unit">
                        <div class="time-value" id="countdownDays">00</div>
                        <span class="time-label">Días</span>
                    </div>
                    <div class="time-unit">
                        <div class="time-value" id="countdownHours">00</div>
                        <span class="time-label">Horas</span>
                    </div>
                    <div class="time-unit">
                        <div class="time-value" id="countdownMinutes">00</div>
                        <span class="time-label">Minutos</span>
                    </div>
                    <div class="time-unit">
                        <div class="time-value" id="countdownSeconds">00</div>
                        <span class="time-label">Segundos</span>
                    </div>
                </div>
            </section>

            <!-- Book animation (botón accesible) -->
            <div class="book-animation">
                <div class="book">
                    <button id="bookCover" class="book-cover" aria-label="Abrir libro maldito" title="Abrir libro (Enter / Espacio)">
                        <div class="book-title">Las Crónicas<br>Malditas</div>
                    </button>

                    <div class="skulls skull-1" aria-hidden="true">💀</div>
                    <div class="skulls skull-2" aria-hidden="true">💀</div>
                    <div class="skulls skull-3" aria-hidden="true">💀</div>
                    <div class="skulls skull-4" aria-hidden="true">💀</div>
                </div>
            </div>

            <!-- CTA -->
            <section class="cta-section" id="ctaSection">
                <p class="cta-text">¿Te atreves a descubrir los secretos más oscuros?<br><em>Una historia te espera...</em></p>
                <button id="ctaButton" class="cta-button" aria-pressed="false">⚰️ Revelar Historia Maldita ⚰️</button>
            </section>

            <!-- Video section -->
            <section id="videoSection" class="video-section" aria-hidden="true">
                <div class="video-container" aria-label="Reproductor de video">
                    <div class="video-inner">
                        <div id="player" class="video-player" role="region" aria-label="Reproductor de YouTube"></div>
                    </div>
                </div>

                <div class="video-controls" role="toolbar" aria-label="Controles de vídeo">
                    <button id="anotherVideoBtn" class="secondary-button">🔮 Otra Historia</button>
                    <button id="backToStartBtn" class="secondary-button">📖 Volver al Inicio</button>
                </div>
            </section>
        </main>

        <footer role="contentinfo" style="margin-top:2.4rem;text-align:center;color:var(--muted);font-size:.9rem;">
            © <span id="year"></span> Las Crónicas Malditas — Hecho con oscuridad y café.
        </footer>
    </div>

    <script>
    // ============================================
    // VARIABLES GLOBALES
    // ============================================
    let player = null;
    let channelVideoIds = [];
    let ytApiLoaded = false;

    // ============================================
    // CONTADOR REGRESIVO
    // ============================================
    function updateCountdown() {
        const now = new Date();
        const currentYear = now.getFullYear();
        let halloween = new Date(currentYear, 9, 31, 0, 0, 0);

        if (now > halloween) {
            halloween = new Date(currentYear + 1, 9, 31, 0, 0, 0);
        }

        const diff = Math.max(0, halloween - now);
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        const daysEl = document.getElementById('countdownDays');
        const hoursEl = document.getElementById('countdownHours');
        const minutesEl = document.getElementById('countdownMinutes');
        const secondsEl = document.getElementById('countdownSeconds');

        if (daysEl) daysEl.textContent = String(days).padStart(2, '0');
        if (hoursEl) hoursEl.textContent = String(hours).padStart(2, '0');
        if (minutesEl) minutesEl.textContent = String(minutes).padStart(2, '0');
        if (secondsEl) secondsEl.textContent = String(seconds).padStart(2, '0');
    }

    // ============================================
    // YOUTUBE PLAYER
    // ============================================
    function ensureYouTubeIframeApi() {
        if (ytApiLoaded) return Promise.resolve();

        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = "https://www.youtube.com/iframe_api";
            script.async = true;
            script.onload = () => resolve();
            script.onerror = () => reject(new Error('No se pudo cargar la API de YouTube'));
            document.body.appendChild(script);
            ytApiLoaded = true;
        });
    }

    function onYouTubeIframeAPIReady() {
        console.log('YouTube IFrame API lista');
    }

    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

    function createPlayer() {
        if (player) return;

        player = new YT.Player('player', {
            width: '100%',
            height: '100%',
            playerVars: { autoplay: 1, controls: 1, rel: 0, modestbranding: 1 },
            events: {
                onReady: () => console.log('Player listo'),
                onError: (e) => console.error('YouTube player error:', e)
            }
        });
    }

    function getRandomVideoId() {
        if (!channelVideoIds || channelVideoIds.length === 0) return null;
        return channelVideoIds[Math.floor(Math.random() * channelVideoIds.length)];
    }

    async function playRandomVideo() {
        const vid = getRandomVideoId();

        if (!vid) {
            console.error('No hay videos disponibles');
            alert('No se encontraron videos. Verifica la configuración de la API.');
            return;
        }

        try {
            await ensureYouTubeIframeApi();

            // Esperar a que YT esté disponible
            let attempts = 0;
            while (typeof YT === 'undefined' && attempts < 20) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }

            if (typeof YT !== 'undefined' && YT.Player) {
                if (!player) createPlayer();

                // Esperar a que el player esté listo
                attempts = 0;
                while (!player.loadVideoById && attempts < 20) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }

                if (player.loadVideoById) {
                    player.loadVideoById(vid);
                } else {
                    throw new Error('Player no está listo');
                }
            } else {
                throw new Error('YT no está disponible');
            }

            // Mostrar sección de video
            document.getElementById('ctaSection').style.display = 'none';
            const videoSection = document.getElementById('videoSection');
            videoSection.classList.add('active');
            videoSection.setAttribute('aria-hidden', 'false');
        } catch (err) {
            console.error('Error al reproducir video:', err);

            // Fallback: usar iframe directo
            const iframe = document.createElement('iframe');
            iframe.width = '100%';
            iframe.height = '100%';
            iframe.src = `https://www.youtube.com/embed/${vid}?autoplay=1&rel=0&modestbranding=1`;
            iframe.frameBorder = '0';
            iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
            iframe.allowFullscreen = true;

            const playerDiv = document.getElementById('player');
            playerDiv.innerHTML = '';
            playerDiv.appendChild(iframe);

            // Mostrar sección de video
            document.getElementById('ctaSection').style.display = 'none';
            const videoSection = document.getElementById('videoSection');
            videoSection.classList.add('active');
            videoSection.setAttribute('aria-hidden', 'false');
        }
    }

    // ============================================
    // INICIALIZACIÓN
    // ============================================
    function init() {
        console.log('Inicializando aplicación...');

        // Año en footer
        const yearEl = document.getElementById('year');
        if (yearEl) yearEl.textContent = new Date().getFullYear();

        // Iniciar contador
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Elementos
        const bookCover = document.getElementById('bookCover');
        const ctaButton = document.getElementById('ctaButton');
        const anotherVideoBtn = document.getElementById('anotherVideoBtn');
        const backToStartBtn = document.getElementById('backToStartBtn');

        if (!bookCover || !ctaButton || !anotherVideoBtn || !backToStartBtn) {
            console.error('No se encontraron todos los elementos necesarios');
            return;
        }

        // Event: Abrir libro
        bookCover.addEventListener('click', () => {
            bookCover.classList.add('opening');
            setTimeout(() => ctaButton.focus(), 900);
        });

        // Event: CTA principal
        ctaButton.addEventListener('click', async () => {
            console.log('CTA clicked');
            ctaButton.setAttribute('aria-pressed', 'true');
            ctaButton.disabled = true;
            const originalText = ctaButton.textContent;
            ctaButton.textContent = '⏳ Cargando historia maldita...';

            try {
                // Cargar videos si no están cargados
                if (channelVideoIds.length === 0) {
                    console.log('Cargando videos desde /api/videos...');
                    const response = await fetch('/api/videos');

                    if (response.ok) {
                        const data = await response.json();
                        console.log('Respuesta de API:', data);

                        if (data.videoIds && data.videoIds.length > 0) {
                            channelVideoIds = data.videoIds;
                            console.log(`✓ Cargados ${channelVideoIds.length} videos`);
                        } else {
                            console.warn('La API no devolvió videos');
                        }
                    } else {
                        const errorText = await response.text();
                        console.error('Error al cargar videos:', response.status, errorText);
                    }
                }

                // Reproducir video
                await playRandomVideo();
            } catch (err) {
                console.error('Error en CTA:', err);
                alert('Hubo un error al cargar los videos. Revisa la consola del navegador.');
            } finally {
                ctaButton.disabled = false;
                ctaButton.textContent = originalText;
                ctaButton.setAttribute('aria-pressed', 'false');
            }
        });

        // Event: Otro video
        anotherVideoBtn.addEventListener('click', () => {
            console.log('Otro video clicked');
            playRandomVideo();
        });

        // Event: Volver al inicio
        backToStartBtn.addEventListener('click', () => {
            console.log('Volver al inicio clicked');
            const videoSection = document.getElementById('videoSection');
            videoSection.classList.remove('active');
            videoSection.setAttribute('aria-hidden', 'true');
            document.getElementById('ctaSection').style.display = 'block';

            // Detener player
            if (player && player.stopVideo) {
                try {
                    player.stopVideo();
                } catch (e) {
                    console.warn('Error al detener player:', e);
                }
            } else {
                const playerDiv = document.getElementById('player');
                if (playerDiv) playerDiv.innerHTML = '';
            }

            // Reset animación del libro
            bookCover.classList.remove('opening');
            bookCover.focus();
        });

        console.log('✓ Aplicación inicializada correctamente');
    }

    // Ejecutar cuando el DOM esté listo
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
    </script>
</body>
</html>
