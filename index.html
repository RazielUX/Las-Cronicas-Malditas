<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Las Crónicas Malditas — cuenta regresiva a Halloween y revelación de historias malditas desde tu canal." />

    <title>Las Crónicas Malditas — Cuenta Regresiva a Halloween</title>

    <!-- Google Analytics 4 -->
    <!-- INSTRUCCIONES: Reemplaza G-XXXXXXXXXX con tu ID de medición de GA4 -->
    <!-- Para obtenerlo: https://analytics.google.com -> Admin -> Data Streams -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX'); // Reemplaza con tu ID real
    </script>

    <!-- Preconnect / Prefetch para rendimiento -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

    <style>
        :root{
            --bg-1: #0a0a0a;
            --bg-2: #1a0a0a;
            --accent-1: #ff0040;
            --accent-2: #ff6600;
            --muted: #b8a992;
            --bord: #8b0000;
            --glass: rgba(10,10,10,0.75);
            --card-dark: linear-gradient(145deg,#1a0505,#0a0a0a);
            --shadow-strong: 0 20px 60px rgba(0,0,0,0.9);
        }

        /* Reset moderno */
        *,*::before,*::after{box-sizing:border-box}
        html,body{height:100%;margin:0;padding:0;}
        body{
            font-family:'IM Fell English', serif;
            background: #0a0a0a;
            color: #e8d5c4;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
            position:relative;
            overflow-x:hidden;
        }

        /* Fondo Lottie */
        #lottie-background {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.4;
            pointer-events: none;
        }

        /* Overlay oscuro para mejorar legibilidad */
        body::before{
            content:"";
            position:fixed;
            inset:0;
            background: linear-gradient(135deg, rgba(10,10,10,0.7) 0%, rgba(26,10,10,0.8) 100%);
            pointer-events:none;
            z-index:1;
        }

        .container{
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: clamp(1rem, 3vh, 2rem) clamp(1rem, 3vw, 2rem);
        }

        /* Countdown como cabecera */
        .countdown-section{
            background: var(--glass);
            border: 3px solid var(--bord);
            border-radius: 16px;
            padding: clamp(0.8rem, 2vh, 1.2rem);
            margin-bottom: clamp(1rem, 2vh, 1.5rem);
            box-shadow: 0 0 30px rgba(139,0,0,0.4), inset 0 0 20px rgba(0,0,0,0.5);
            animation: fadeInDown .6s ease-out both;
            backdrop-filter: blur(10px);
        }

        .countdown-title{
            font-family:'Creepster',cursive;
            color: var(--accent-2);
            font-size: clamp(1.1rem, 3vw, 1.8rem);
            text-align: center;
            margin-bottom: clamp(0.5rem, 1vh, 0.8rem);
            text-shadow: 0 0 15px rgba(255,102,0,0.8);
            letter-spacing: 1px;
        }

        .countdown-timer{
            display: flex;
            justify-content: center;
            gap: clamp(0.4rem, 1.5vw, 1rem);
            flex-wrap: wrap;
        }

        .time-unit{
            background: var(--card-dark);
            border: 2px solid var(--bord);
            border-radius: 10px;
            padding: clamp(0.5rem, 1.5vh, 0.8rem) clamp(0.4rem, 1vw, 0.7rem);
            min-width: clamp(55px, 12vw, 80px);
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.7), inset 0 2px 10px rgba(139,0,0,0.4);
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .time-unit:hover{
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(139,0,0,0.5);
        }

        .time-value{
            display: block;
            font-family:'Creepster',cursive;
            color: var(--accent-1);
            font-size: clamp(1.3rem, 3.5vw, 2.2rem);
            text-shadow: 0 0 15px rgba(255,0,64,0.9), 0 0 30px rgba(139,0,0,0.6);
            margin-bottom: 0.2rem;
            line-height: 1;
        }

        .time-label{
            display: block;
            font-size: clamp(0.65rem, 1.3vw, 0.8rem);
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        /* Área principal del libro/video - Ocupa todo el espacio restante */
        .main-content-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
        }

        /* Book section - Más grande y centrado */
        .book-section {
            width: 100%;
            max-width: 700px;
            position: relative;
            animation: fadeIn .8s ease-out both;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .book-section.hiding {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        .book-animation {
            width: 100%;
            position: relative;
            perspective: 1500px;
        }

        .book{
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Libro mejorado para verse más real */
        .book-cover{
            width: 100%;
            max-width: 550px;
            aspect-ratio: 3/4;
            background:
                linear-gradient(145deg, #3a2314 0%, #2d1810 50%, #1a0f08 100%),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 2px,
                    rgba(0,0,0,0.1) 2px,
                    rgba(0,0,0,0.1) 3px
                );
            border: 6px solid #5d3a1a;
            border-left: 15px solid #4a2810;
            border-radius: 8px 12px 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: transform .3s ease, box-shadow .3s ease;
            box-shadow:
                -15px 0 25px rgba(0,0,0,0.5),
                0 20px 60px rgba(0,0,0,0.9),
                0 30px 80px rgba(255,0,64,0.3),
                inset 0 0 80px rgba(139,0,0,0.3),
                inset -5px 0 15px rgba(0,0,0,0.7);
            outline: none;
            padding: clamp(1.5rem, 4vw, 3rem);
        }

        /* Efecto de páginas del libro */
        .book-cover::before {
            content: "";
            position: absolute;
            left: 6px;
            top: 10px;
            bottom: 10px;
            width: 4px;
            background: repeating-linear-gradient(
                0deg,
                #e8d5c4 0px,
                #e8d5c4 2px,
                transparent 2px,
                transparent 4px
            );
            opacity: 0.3;
        }

        /* Lomo del libro */
        .book-cover::after {
            content: "";
            position: absolute;
            left: -15px;
            top: 0;
            bottom: 0;
            width: 15px;
            background: linear-gradient(90deg, #2d1810 0%, #4a2810 50%, #2d1810 100%);
            border-radius: 8px 0 0 8px;
            box-shadow: inset 2px 0 5px rgba(0,0,0,0.6);
        }

        .book-cover:hover{
            transform: translateY(-8px) rotateY(-2deg) scale(1.02);
            box-shadow:
                -18px 0 30px rgba(0,0,0,0.6),
                0 35px 90px rgba(0,0,0,0.95),
                0 45px 100px rgba(255,0,64,0.5),
                inset 0 0 100px rgba(139,0,0,0.4),
                inset -5px 0 20px rgba(0,0,0,0.8);
        }

        .book-cover:focus{
            outline: 3px solid rgba(255,0,64,0.6);
            outline-offset: 4px;
        }

        .book-title{
            font-family:'Creepster',cursive;
            font-size: clamp(2.2rem, 5.5vw, 4rem);
            color: var(--accent-1);
            text-align: center;
            text-shadow:
                0 0 25px rgba(255,0,64,1),
                0 0 50px rgba(139,0,0,0.8),
                3px 3px 10px rgba(0,0,0,1);
            margin-bottom: clamp(1.5rem, 3vh, 2.5rem);
            line-height: 1.1;
            letter-spacing: 2px;
        }

        .book-cta-text{
            font-size: clamp(1rem, 2.3vw, 1.25rem);
            color: #e8d5c4;
            text-align: center;
            margin-bottom: clamp(1.2rem, 2.5vh, 2rem);
            font-style: italic;
            text-shadow: 2px 2px 8px rgba(0,0,0,1);
            padding: 0 1rem;
            line-height: 1.4;
        }

        /* Botón CTA optimizado (hug content) */
        .cta-button{
            font-family:'Creepster',cursive;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: linear-gradient(145deg,#8b0000,#ff0040);
            color: #fff;
            border: 3px solid var(--accent-1);
            border-radius: 50px;
            padding: clamp(0.75rem, 2vh, 1rem) clamp(1.5rem, 3vw, 2rem);
            font-size: clamp(0.95rem, 2.2vw, 1.3rem);
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255,0,64,0.5), inset 0 -5px 15px rgba(0,0,0,0.5);
            text-transform: uppercase;
            letter-spacing: 1.4px;
            transition: transform .3s ease, box-shadow .3s ease;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        .cta-button:focus{
            outline: 3px solid rgba(255,0,64,0.6);
            outline-offset: 3px;
        }

        .cta-button::before{
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: width .4s, height .4s;
        }

        .cta-button:hover{
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 15px 45px rgba(255,0,64,0.7);
        }

        .cta-button:hover::before{
            width: 400px;
            height: 400px;
        }

        .cta-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Calaveras flotantes alrededor del libro */
        .skulls{
            position: absolute;
            font-size: clamp(2rem, 4.5vw, 3.5rem);
            opacity: .2;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(255,0,64,0.5));
        }
        .skull-1{ top: 3%; left: 3%; animation: skullFloat 3.5s ease-in-out infinite; }
        .skull-2{ top: 3%; right: 3%; animation: skullFloat 3.5s ease-in-out infinite .7s; }
        .skull-3{ bottom: 3%; left: 3%; animation: skullFloat 3.5s ease-in-out infinite 1.2s; }
        .skull-4{ bottom: 3%; right: 3%; animation: skullFloat 3.5s ease-in-out infinite 1.8s; }

        @keyframes skullFloat{
            0%,100%{ transform: translateY(0) rotate(0deg); opacity: 0.2; }
            50%{ transform: translateY(-18px) rotate(6deg); opacity: 0.35; }
        }

        /* Video section - Reemplaza al libro */
        .video-section{
            display: none;
            width: 100%;
            max-width: 1000px;
            animation: fadeInScale .7s ease-out;
        }

        .video-section.active{
            display: block;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .video-container{
            position: relative;
            width: 100%;
            margin: 0 auto 1.5rem;
            background: #000;
            border: 5px solid var(--accent-1);
            border-radius: 20px;
            overflow: hidden;
            box-shadow:
                0 0 60px rgba(255,0,64,0.6),
                0 20px 80px rgba(0,0,0,0.9);
        }

        .video-inner{
            width: 100%;
            height: 0;
            padding-bottom: 56.25%;
            position: relative;
        }

        #player{
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .video-controls{
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .secondary-button{
            font-family: 'IM Fell English', serif;
            background: rgba(74,123,167,0.25);
            color: #4a7ba7;
            border: 2px solid #4a7ba7;
            padding: clamp(0.7rem, 1.8vw, 0.95rem) clamp(1.3rem, 2.8vw, 1.7rem);
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all .25s ease;
            font-size: clamp(0.85rem, 1.8vw, 1rem);
        }

        .secondary-button:hover{
            transform: translateY(-3px);
            background: rgba(74,123,167,0.45);
            box-shadow: 0 10px 25px rgba(74,123,167,0.35);
        }

        /* Footer compacto */
        footer {
            text-align: center;
            color: var(--muted);
            font-size: clamp(0.75rem, 1.4vw, 0.9rem);
            padding: clamp(0.8rem, 1.5vh, 1.2rem) 0;
            opacity: 0.7;
        }

        /* Animations */
        @keyframes fadeInDown{
            from{ opacity:0; transform:translateY(-20px)}
            to{ opacity:1; transform:none }
        }

        @keyframes fadeIn{
            from{ opacity:0 }
            to{ opacity:1 }
        }

        /* Responsive adjustments para MacBook 13" (1440x900) y menores */
        @media (max-height: 900px) and (min-width: 1024px) {
            .container{
                padding: 1.5vh 2vw;
            }

            .countdown-section{
                padding: 0.8rem;
                margin-bottom: 1rem;
            }

            .book-cover{
                max-width: 480px;
                padding: 2rem;
            }
        }

        @media (max-width: 768px){
            .book-cover{
                max-width: 400px;
                padding: 1.8rem;
                border-left: 12px solid #4a2810;
            }
        }

        @media (max-width: 480px){
            .container{
                padding: 1rem;
            }

            .countdown-timer{
                gap: 0.4rem;
            }

            .time-unit{
                min-width: 50px;
                padding: 0.5rem 0.3rem;
            }

            .book-cover{
                max-width: 320px;
                padding: 1.2rem;
                border-left: 10px solid #4a2810;
            }

            .skulls{
                font-size: 1.8rem;
            }
        }

        /* Respect user motion preferences */
        @media (prefers-reduced-motion: reduce){
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- Fondo Lottie animado -->
    <div id="lottie-background"></div>

    <div class="container">
        <!-- Countdown como cabecera -->
        <section class="countdown-section" aria-labelledby="countdownTitle">
            <h1 id="countdownTitle" class="countdown-title">🎃 Cuenta Regresiva a Halloween 🎃</h1>
            <div class="countdown-timer">
                <div class="time-unit">
                    <div class="time-value" id="countdownDays">00</div>
                    <span class="time-label">Días</span>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="countdownHours">00</div>
                    <span class="time-label">Horas</span>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="countdownMinutes">00</div>
                    <span class="time-label">Minutos</span>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="countdownSeconds">00</div>
                    <span class="time-label">Segundos</span>
                </div>
            </div>
        </section>

        <!-- Área principal: Libro o Video -->
        <div class="main-content-area">
            <!-- Sección del Libro -->
            <section class="book-section" id="bookSection">
                <div class="book-animation">
                    <div class="book">
                        <div class="book-cover" id="bookCover" tabindex="0" role="button" aria-label="Abrir libro maldito">
                            <h2 class="book-title">Las Crónicas<br>Malditas</h2>
                            <p class="book-cta-text">¿Te atreves a descubrir los secretos más oscuros?</p>
                            <button id="ctaButton" class="cta-button" aria-pressed="false">
                                ⚰️ Revelar Historia
                            </button>
                        </div>

                        <div class="skulls skull-1" aria-hidden="true">💀</div>
                        <div class="skulls skull-2" aria-hidden="true">💀</div>
                        <div class="skulls skull-3" aria-hidden="true">💀</div>
                        <div class="skulls skull-4" aria-hidden="true">💀</div>
                    </div>
                </div>
            </section>

            <!-- Sección de Video - Reemplaza al libro -->
            <section id="videoSection" class="video-section" aria-hidden="true">
                <div class="video-container" aria-label="Reproductor de video">
                    <div class="video-inner">
                        <div id="player" class="video-player" role="region" aria-label="Reproductor de YouTube"></div>
                    </div>
                </div>

                <div class="video-controls" role="toolbar" aria-label="Controles de vídeo">
                    <button id="anotherVideoBtn" class="secondary-button">🔮 Otra Historia</button>
                    <button id="backToStartBtn" class="secondary-button">📖 Volver al Inicio</button>
                </div>
            </section>
        </div>

        <footer role="contentinfo">
            © <span id="year"></span> Las Crónicas Malditas
        </footer>
    </div>

    <!-- Lottie Player -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

    <script>
    // ============================================
    // VARIABLES GLOBALES
    // ============================================
    let player = null;
    let channelVideoIds = [];
    let ytApiLoaded = false;

    // ============================================
    // ANALYTICS Y TRACKING
    // ============================================
    const Analytics = {
        // Configuración
        useGoogleAnalytics: true, // Cambiar a false si no usas GA4
        useCustomAPI: true, // Cambiar a false si no quieres usar el endpoint propio

        // Track de evento genérico
        trackEvent(eventName, eventParams = {}) {
            console.log('📊 Analytics:', eventName, eventParams);

            // Google Analytics 4
            if (this.useGoogleAnalytics && typeof gtag !== 'undefined') {
                gtag('event', eventName, eventParams);
            }

            // API propia para almacenamiento interno
            if (this.useCustomAPI) {
                this.sendToCustomAPI(eventName, eventParams);
            }
        },

        // Enviar a API propia
        async sendToCustomAPI(eventName, eventParams) {
            try {
                await fetch('/api/analytics', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        event: eventName,
                        params: eventParams,
                        timestamp: new Date().toISOString(),
                        userAgent: navigator.userAgent,
                        screenSize: `${window.innerWidth}x${window.innerHeight}`,
                        referrer: document.referrer || 'direct'
                    })
                });
            } catch (err) {
                console.warn('Error enviando analytics a API propia:', err);
            }
        },

        // Track de página vista
        trackPageView() {
            this.trackEvent('page_view', {
                page_title: document.title,
                page_location: window.location.href,
                page_path: window.location.pathname
            });
        },

        // Track de click en CTA
        trackCTAClick() {
            this.trackEvent('cta_click', {
                button_name: 'Revelar Historia',
                button_location: 'libro_principal'
            });
        },

        // Track de video reproducido
        trackVideoPlay(videoId) {
            this.trackEvent('video_play', {
                video_id: videoId,
                video_source: 'youtube'
            });
        },

        // Track de otro video
        trackAnotherVideo() {
            this.trackEvent('another_video_click', {
                button_name: 'Otra Historia'
            });
        },

        // Track de volver al inicio
        trackBackToStart() {
            this.trackEvent('back_to_start_click', {
                button_name: 'Volver al Inicio'
            });
        }
    };

    // ============================================
    // LOTTIE BACKGROUND
    // ============================================
    function initLottieBackground() {
        // Animación de terror/Halloween de LottieFiles
        // Usando una animación de Halloween con fantasmas y elementos tenebrosos
        const animation = lottie.loadAnimation({
            container: document.getElementById('lottie-background'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: 'https://lottie.host/c4b4ed5b-8f6c-4e5d-b7a5-5c0c3e3e7d9e/Kg7jKpPdWE.json' // Animación de Halloween
        });

        // Fallback: si la animación no carga, crear una animación CSS simple
        setTimeout(() => {
            if (!animation.isLoaded) {
                console.warn('Lottie no cargó, usando fallback');
                const bg = document.getElementById('lottie-background');
                bg.style.background = 'radial-gradient(ellipse at center, rgba(139,0,0,0.1) 0%, transparent 70%)';
                bg.style.animation = 'bgPulse 6s ease-in-out infinite';
            }
        }, 3000);
    }

    // ============================================
    // CONTADOR REGRESIVO
    // ============================================
    function updateCountdown() {
        const now = new Date();
        const currentYear = now.getFullYear();
        let halloween = new Date(currentYear, 9, 31, 0, 0, 0);

        if (now > halloween) {
            halloween = new Date(currentYear + 1, 9, 31, 0, 0, 0);
        }

        const diff = Math.max(0, halloween - now);
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        const daysEl = document.getElementById('countdownDays');
        const hoursEl = document.getElementById('countdownHours');
        const minutesEl = document.getElementById('countdownMinutes');
        const secondsEl = document.getElementById('countdownSeconds');

        if (daysEl) daysEl.textContent = String(days).padStart(2, '0');
        if (hoursEl) hoursEl.textContent = String(hours).padStart(2, '0');
        if (minutesEl) minutesEl.textContent = String(minutes).padStart(2, '0');
        if (secondsEl) secondsEl.textContent = String(seconds).padStart(2, '0');
    }

    // ============================================
    // YOUTUBE PLAYER
    // ============================================
    function ensureYouTubeIframeApi() {
        if (ytApiLoaded) return Promise.resolve();

        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = "https://www.youtube.com/iframe_api";
            script.async = true;
            script.onload = () => resolve();
            script.onerror = () => reject(new Error('No se pudo cargar la API de YouTube'));
            document.body.appendChild(script);
            ytApiLoaded = true;
        });
    }

    function onYouTubeIframeAPIReady() {
        console.log('YouTube IFrame API lista');
    }

    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

    function createPlayer() {
        if (player) return;

        player = new YT.Player('player', {
            width: '100%',
            height: '100%',
            playerVars: { autoplay: 1, controls: 1, rel: 0, modestbranding: 1 },
            events: {
                onReady: () => console.log('Player listo'),
                onError: (e) => console.error('YouTube player error:', e)
            }
        });
    }

    function getRandomVideoId() {
        if (!channelVideoIds || channelVideoIds.length === 0) return null;
        return channelVideoIds[Math.floor(Math.random() * channelVideoIds.length)];
    }

    async function playRandomVideo() {
        const vid = getRandomVideoId();

        if (!vid) {
            console.error('No hay videos disponibles');
            alert('No se encontraron videos. Verifica la configuración de la API.');
            return;
        }

        try {
            await ensureYouTubeIframeApi();

            // Esperar a que YT esté disponible
            let attempts = 0;
            while (typeof YT === 'undefined' && attempts < 20) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }

            if (typeof YT !== 'undefined' && YT.Player) {
                if (!player) createPlayer();

                // Esperar a que el player esté listo
                attempts = 0;
                while (!player.loadVideoById && attempts < 20) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }

                if (player.loadVideoById) {
                    player.loadVideoById(vid);
                } else {
                    throw new Error('Player no está listo');
                }
            } else {
                throw new Error('YT no está disponible');
            }

            // Transición del libro al video
            showVideoSection();
        } catch (err) {
            console.error('Error al reproducir video:', err);

            // Fallback: usar iframe directo
            const iframe = document.createElement('iframe');
            iframe.width = '100%';
            iframe.height = '100%';
            iframe.src = `https://www.youtube.com/embed/${vid}?autoplay=1&rel=0&modestbranding=1`;
            iframe.frameBorder = '0';
            iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
            iframe.allowFullscreen = true;

            const playerDiv = document.getElementById('player');
            playerDiv.innerHTML = '';
            playerDiv.appendChild(iframe);

            // Transición del libro al video
            showVideoSection();
        }
    }

    function showVideoSection() {
        const bookSection = document.getElementById('bookSection');
        const videoSection = document.getElementById('videoSection');

        // Ocultar libro con animación
        bookSection.classList.add('hiding');

        setTimeout(() => {
            bookSection.style.display = 'none';
            videoSection.classList.add('active');
            videoSection.setAttribute('aria-hidden', 'false');
        }, 500);
    }

    function showBookSection() {
        const bookSection = document.getElementById('bookSection');
        const videoSection = document.getElementById('videoSection');

        // Ocultar video
        videoSection.classList.remove('active');
        videoSection.setAttribute('aria-hidden', 'true');

        // Mostrar libro con animación
        bookSection.style.display = 'block';
        setTimeout(() => {
            bookSection.classList.remove('hiding');
        }, 50);

        // Detener player
        if (player && player.stopVideo) {
            try {
                player.stopVideo();
            } catch (e) {
                console.warn('Error al detener player:', e);
            }
        } else {
            const playerDiv = document.getElementById('player');
            if (playerDiv) playerDiv.innerHTML = '';
        }
    }

    // ============================================
    // INICIALIZACIÓN
    // ============================================
    function init() {
        console.log('Inicializando aplicación...');

        // Track de página vista
        Analytics.trackPageView();

        // Iniciar Lottie background
        initLottieBackground();

        // Año en footer
        const yearEl = document.getElementById('year');
        if (yearEl) yearEl.textContent = new Date().getFullYear();

        // Iniciar contador
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Elementos
        const ctaButton = document.getElementById('ctaButton');
        const anotherVideoBtn = document.getElementById('anotherVideoBtn');
        const backToStartBtn = document.getElementById('backToStartBtn');

        if (!ctaButton || !anotherVideoBtn || !backToStartBtn) {
            console.error('No se encontraron todos los elementos necesarios');
            return;
        }

        // Event: CTA principal
        ctaButton.addEventListener('click', async (e) => {
            e.stopPropagation();
            console.log('CTA clicked');

            // Track del click en CTA
            Analytics.trackCTAClick();

            ctaButton.setAttribute('aria-pressed', 'true');
            ctaButton.disabled = true;
            const originalText = ctaButton.textContent;
            ctaButton.textContent = '⏳ Cargando...';

            try {
                // Cargar videos si no están cargados
                if (channelVideoIds.length === 0) {
                    console.log('Cargando videos desde /api/videos...');
                    const response = await fetch('/api/videos');

                    if (response.ok) {
                        const data = await response.json();
                        console.log('Respuesta de API:', data);

                        if (data.videoIds && data.videoIds.length > 0) {
                            channelVideoIds = data.videoIds;
                            console.log(`✓ Cargados ${channelVideoIds.length} videos`);
                        } else {
                            console.warn('La API no devolvió videos');
                        }
                    } else {
                        const errorText = await response.text();
                        console.error('Error al cargar videos:', response.status, errorText);
                    }
                }

                // Reproducir video
                await playRandomVideo();

                // Track de video reproducido
                if (channelVideoIds.length > 0) {
                    const currentVideoId = getRandomVideoId();
                    Analytics.trackVideoPlay(currentVideoId);
                }
            } catch (err) {
                console.error('Error en CTA:', err);
                alert('Hubo un error al cargar los videos. Revisa la consola del navegador.');
                ctaButton.disabled = false;
                ctaButton.textContent = originalText;
                ctaButton.setAttribute('aria-pressed', 'false');
            }
        });

        // Event: Otro video
        anotherVideoBtn.addEventListener('click', () => {
            console.log('Otro video clicked');
            Analytics.trackAnotherVideo();
            playRandomVideo();
        });

        // Event: Volver al inicio
        backToStartBtn.addEventListener('click', () => {
            console.log('Volver al inicio clicked');
            Analytics.trackBackToStart();
            showBookSection();
        });

        console.log('✓ Aplicación inicializada correctamente');
    }

    // Ejecutar cuando el DOM esté listo
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
    </script>
</body>
