<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Las Crónicas Malditas — cuenta regresiva a Halloween y revelación de historias malditas desde tu canal." />

    <title>Las Crónicas Malditas — Cuenta Regresiva a Halloween</title>

    <!-- Preconnect / Prefetch para rendimiento -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

    <style>
        :root{
            --bg-1: #0a0a0a;
            --bg-2: #1a0a0a;
            --accent-1: #ff0040;
            --accent-2: #ff6600;
            --muted: #b8a992;
            --bord: #8b0000;
            --glass: rgba(10,10,10,0.6);
            --card-dark: linear-gradient(145deg,#1a0505,#0a0a0a);
            --shadow-strong: 0 20px 60px rgba(0,0,0,0.9);
        }

        /* Reset moderno */
        *,*::before,*::after{box-sizing:border-box}
        html,body{height:100%}
        body{
            margin:0;
            font-family:'IM Fell English', serif;
            background: linear-gradient(135deg,var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-1) 100%);
            color: #e8d5c4;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
            min-height:100vh;
            position:relative;
            overflow-x:hidden;
        }

        /* Fondo animado con niebla y partículas */
        body::before{
            content:"";
            position:fixed; inset:0;
            background:
                radial-gradient(circle at 20% 50%, rgba(139,0,0,0.08) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(74,123,167,0.08) 0%, transparent 45%);
            pointer-events:none;
            z-index:0;
            animation: bgPulse 8s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* Partículas flotantes */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 0, 64, 0.3);
            border-radius: 50%;
            animation: float linear infinite;
            box-shadow: 0 0 10px rgba(255, 0, 64, 0.5);
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Niebla en movimiento */
        .fog {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .fog-layer {
            position: absolute;
            width: 200%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(139, 0, 0, 0.05) 50%, transparent 100%);
            animation: fogMove 30s ease-in-out infinite;
        }

        .fog-layer:nth-child(1) {
            animation-duration: 25s;
            opacity: 0.5;
        }

        .fog-layer:nth-child(2) {
            animation-duration: 35s;
            animation-delay: -10s;
            opacity: 0.3;
        }

        @keyframes fogMove {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(0%) translateY(-20px);
            }
        }

        /* Relámpagos ocasionales */
        .lightning {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            background: rgba(255, 255, 255, 0);
            animation: lightning 15s infinite;
        }

        @keyframes lightning {
            0%, 100% { background: rgba(255, 255, 255, 0); }
            49.9%, 50.1%, 50.3%, 50.5% { background: rgba(255, 255, 255, 0.05); }
            50.2%, 50.4% { background: rgba(255, 255, 255, 0); }
        }

        .container{
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        /* Header */
        header.header{
            text-align:center;
            margin-bottom: 2rem;
            animation:fadeInDown .9s ease-out both;
        }
        .logo{
            font-family:'Creepster',cursive;
            color:var(--accent-1);
            font-size: clamp(2rem, 6vw, 4rem);
            text-shadow:
                0 0 20px rgba(255,0,64,0.85),
                0 0 40px rgba(139,0,0,0.6),
                3px 3px 6px rgba(0,0,0,0.9);
            letter-spacing:3px;
            margin-bottom:.5rem;
        }
        .tagline{
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color:var(--muted);
            font-style:italic;
            text-shadow:2px 2px 4px rgba(0,0,0,0.8);
        }

        /* Countdown */
        .countdown-section{
            background:var(--glass);
            border:3px solid var(--bord);
            border-radius:20px;
            padding: clamp(1rem, 3vw, 1.6rem);
            margin-bottom: 2rem;
            box-shadow: 0 0 30px rgba(139,0,0,0.32), inset 0 0 20px rgba(0,0,0,0.45);
            animation:fadeIn .9s ease-out both;
        }
        .countdown-title{
            font-family:'Creepster',cursive;
            color:var(--accent-2);
            font-size: clamp(1.2rem, 3.5vw, 2.2rem);
            text-align:center;
            margin-bottom: 1rem;
            text-shadow:0 0 15px rgba(255,102,0,0.75);
        }
        .countdown-timer{
            display:flex;
            justify-content:center;
            gap: clamp(0.5rem, 2vw, 1.2rem);
            flex-wrap:wrap;
        }
        .time-unit{
            background:var(--card-dark);
            border:2px solid var(--bord);
            border-radius:12px;
            padding: clamp(0.8rem, 2vw, 1.2rem) clamp(0.6rem, 1.5vw, 0.9rem);
            min-width: clamp(70px, 15vw, 100px);
            text-align:center;
            box-shadow: 0 8px 18px rgba(0,0,0,0.6), inset 0 2px 12px rgba(139,0,0,0.3);
            transition: transform .24s ease, box-shadow .24s ease;
        }
        .time-unit:hover{ transform:translateY(-6px); box-shadow: 0 16px 36px rgba(139,0,0,0.45); }
        .time-value{
            display:block;
            font-family:'Creepster',cursive;
            color:var(--accent-1);
            font-size: clamp(1.5rem, 4vw, 3rem);
            text-shadow: 0 0 20px rgba(255,0,64,0.9), 0 0 40px rgba(139,0,0,0.6);
            margin-bottom:.3rem;
            line-height:1;
        }
        .time-label{
            display:block;
            font-size: clamp(0.7rem, 1.5vw, 0.9rem);
            color:var(--muted);
            text-transform:uppercase;
            letter-spacing:1.6px;
        }

        /* Área principal del libro/video */
        .main-content-area {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            min-height: clamp(400px, 60vh, 700px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Book animation - Más grande y con CTA integrado */
        .book-section {
            width: 100%;
            position: relative;
            animation: fadeIn .9s ease-out both;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .book-section.hiding {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        .book-animation {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            aspect-ratio: 1;
        }

        .book{
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .book-cover{
            width: 100%;
            max-width: 450px;
            aspect-ratio: 3/4;
            background: linear-gradient(145deg,#2d1810,#1a0f08);
            border: 5px solid #8b4513;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: transform .3s ease;
            box-shadow:
                0 20px 60px rgba(0,0,0,0.9),
                0 30px 80px rgba(255,0,64,0.3),
                inset 0 0 60px rgba(139,0,0,0.4);
            outline: none;
            padding: 2rem;
        }

        .book-cover:hover{
            transform: translateY(-10px) scale(1.02);
            box-shadow:
                0 30px 80px rgba(0,0,0,0.95),
                0 40px 100px rgba(255,0,64,0.5),
                inset 0 0 80px rgba(139,0,0,0.5);
        }

        .book-cover:focus{
            box-shadow:
                0 20px 60px rgba(255,0,64,0.6),
                0 10px 40px rgba(0,0,0,0.95);
            transform: translateY(-4px) scale(1.02);
        }

        .book-title{
            font-family:'Creepster',cursive;
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: var(--accent-1);
            text-align: center;
            text-shadow: 0 0 20px rgba(255,0,64,0.9);
            margin-bottom: 2rem;
            line-height: 1.2;
        }

        .book-cta-text{
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            color: #e8d5c4;
            text-align: center;
            margin-bottom: 1.5rem;
            font-style: italic;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            padding: 0 1rem;
        }

        .cta-button{
            font-family:'Creepster',cursive;
            display: inline-block;
            background: linear-gradient(145deg,#8b0000,#ff0040);
            color: #fff;
            border: 3px solid var(--accent-1);
            border-radius: 50px;
            padding: clamp(0.8rem, 2vw, 1.2rem) clamp(1.5rem, 3vw, 2.5rem);
            font-size: clamp(0.9rem, 2.5vw, 1.4rem);
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255,0,64,0.4), inset 0 -5px 15px rgba(0,0,0,0.45);
            text-transform: uppercase;
            letter-spacing: 1.6px;
            transition: transform .24s ease, box-shadow .24s ease;
            position: relative;
            overflow: hidden;
        }

        .cta-button:focus{
            outline: 3px solid rgba(255,0,64,0.5);
            outline-offset: 2px;
        }

        .cta-button::before{
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: width .5s, height .5s;
        }

        .cta-button:hover{
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255,0,64,0.6);
        }

        .cta-button:hover::before{
            width: 300px;
            height: 300px;
        }

        .cta-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Calaveras flotantes alrededor del libro */
        .skulls{
            position: absolute;
            font-size: clamp(2rem, 5vw, 3.5rem);
            opacity: .25;
            pointer-events: none;
        }
        .skull-1{ top: 5%; left: 5%; animation: skullFloat 3.2s ease-in-out infinite; }
        .skull-2{ top: 5%; right: 5%; animation: skullFloat 3.2s ease-in-out infinite .6s; }
        .skull-3{ bottom: 5%; left: 5%; animation: skullFloat 3.2s ease-in-out infinite 1.1s; }
        .skull-4{ bottom: 5%; right: 5%; animation: skullFloat 3.2s ease-in-out infinite 1.6s; }

        @keyframes skullFloat{
            0%,100%{ transform: translateY(0) rotate(0deg); opacity: 0.25; }
            50%{ transform: translateY(-15px) rotate(5deg); opacity: 0.4; }
        }

        /* Video section - Reemplaza al libro */
        .video-section{
            display: none;
            width: 100%;
            animation: fadeInScale .8s ease-out;
        }

        .video-section.active{
            display: block;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .video-container{
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto 1.5rem;
            background: #000;
            border: 5px solid var(--accent-1);
            border-radius: 20px;
            overflow: hidden;
            box-shadow:
                0 0 60px rgba(255,0,64,0.6),
                0 20px 80px rgba(0,0,0,0.9);
        }

        .video-inner{
            width: 100%;
            height: 0;
            padding-bottom: 56.25%;
            position: relative;
        }

        #player{
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .video-controls{
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .secondary-button{
            font-family: 'IM Fell English', serif;
            background: rgba(74,123,167,0.2);
            color: #4a7ba7;
            border: 2px solid #4a7ba7;
            padding: clamp(0.7rem, 2vw, 1rem) clamp(1.2rem, 3vw, 1.8rem);
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all .3s ease;
            font-size: clamp(0.8rem, 2vw, 1rem);
        }

        .secondary-button:hover{
            transform: translateY(-4px);
            background: rgba(74,123,167,0.4);
            box-shadow: 0 10px 25px rgba(74,123,167,0.3);
        }

        /* Footer */
        footer {
            margin-top: 3rem;
            text-align: center;
            color: var(--muted);
            font-size: clamp(0.8rem, 1.5vw, 0.95rem);
            padding-bottom: 2rem;
        }

        /* Animations */
        @keyframes fadeInDown{
            from{ opacity:0; transform:translateY(-30px)}
            to{ opacity:1; transform:none }
        }

        @keyframes fadeInUp{
            from{ opacity:0; transform:translateY(30px)}
            to{ opacity:1; transform:none }
        }

        @keyframes fadeIn{
            from{ opacity:0 }
            to{ opacity:1 }
        }

        /* Responsive adjustments */
        @media (max-width: 768px){
            .container{
                padding: 1rem;
            }

            .book-cover{
                padding: 1.5rem;
                max-width: 350px;
            }

            .book-cta-text{
                padding: 0 0.5rem;
            }

            .main-content-area {
                min-height: clamp(350px, 50vh, 600px);
            }
        }

        @media (max-width: 480px){
            .countdown-timer{
                gap: 0.5rem;
            }

            .time-unit{
                min-width: 60px;
                padding: 0.6rem 0.4rem;
            }

            .book-cover{
                max-width: 300px;
                padding: 1rem;
            }

            .skulls{
                font-size: 1.5rem;
            }
        }

        /* Respect user motion preferences */
        @media (prefers-reduced-motion: reduce){
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- Efectos de fondo -->
    <div class="fog">
        <div class="fog-layer"></div>
        <div class="fog-layer"></div>
    </div>
    <div class="particles" id="particles"></div>
    <div class="lightning"></div>

    <div class="container">
        <header class="header" role="banner">
            <h1 class="logo">Las Crónicas Malditas</h1>
            <p class="tagline">Donde las historias oscuras cobran vida...</p>
        </header>

        <main id="main" role="main">
            <!-- Countdown -->
            <section class="countdown-section" aria-labelledby="countdownTitle">
                <h2 id="countdownTitle" class="countdown-title">🎃 Cuenta Regresiva a Halloween 🎃</h2>
                <div class="countdown-timer">
                    <div class="time-unit">
                        <div class="time-value" id="countdownDays">00</div>
                        <span class="time-label">Días</span>
                    </div>
                    <div class="time-unit">
                        <div class="time-value" id="countdownHours">00</div>
                        <span class="time-label">Horas</span>
                    </div>
                    <div class="time-unit">
                        <div class="time-value" id="countdownMinutes">00</div>
                        <span class="time-label">Minutos</span>
                    </div>
                    <div class="time-unit">
                        <div class="time-value" id="countdownSeconds">00</div>
                        <span class="time-label">Segundos</span>
                    </div>
                </div>
            </section>

            <!-- Área principal: Libro o Video -->
            <div class="main-content-area">
                <!-- Sección del Libro con CTA integrado -->
                <section class="book-section" id="bookSection">
                    <div class="book-animation">
                        <div class="book">
                            <div class="book-cover" id="bookCover" tabindex="0" role="button" aria-label="Abrir libro maldito">
                                <h2 class="book-title">Las Crónicas<br>Malditas</h2>
                                <p class="book-cta-text">¿Te atreves a descubrir los secretos más oscuros?</p>
                                <button id="ctaButton" class="cta-button" aria-pressed="false">
                                    ⚰️ Revelar Historia Maldita ⚰️
                                </button>
                            </div>

                            <div class="skulls skull-1" aria-hidden="true">💀</div>
                            <div class="skulls skull-2" aria-hidden="true">💀</div>
                            <div class="skulls skull-3" aria-hidden="true">💀</div>
                            <div class="skulls skull-4" aria-hidden="true">💀</div>
                        </div>
                    </div>
                </section>

                <!-- Sección de Video - Reemplaza al libro -->
                <section id="videoSection" class="video-section" aria-hidden="true">
                    <div class="video-container" aria-label="Reproductor de video">
                        <div class="video-inner">
                            <div id="player" class="video-player" role="region" aria-label="Reproductor de YouTube"></div>
                        </div>
                    </div>

                    <div class="video-controls" role="toolbar" aria-label="Controles de vídeo">
                        <button id="anotherVideoBtn" class="secondary-button">🔮 Otra Historia</button>
                        <button id="backToStartBtn" class="secondary-button">📖 Volver al Inicio</button>
                    </div>
                </section>
            </div>
        </main>

        <footer role="contentinfo">
            © <span id="year"></span> Las Crónicas Malditas — Hecho con oscuridad y café.
        </footer>
    </div>

    <script>
    // ============================================
    // VARIABLES GLOBALES
    // ============================================
    let player = null;
    let channelVideoIds = [];
    let ytApiLoaded = false;

    // ============================================
    // EFECTOS DE FONDO
    // ============================================
    function createParticles() {
        const particlesContainer = document.getElementById('particles');
        const particleCount = window.innerWidth < 768 ? 15 : 30;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (15 + Math.random() * 20) + 's';
            particle.style.animationDelay = Math.random() * 10 + 's';
            particlesContainer.appendChild(particle);
        }
    }

    // ============================================
    // CONTADOR REGRESIVO
    // ============================================
    function updateCountdown() {
        const now = new Date();
        const currentYear = now.getFullYear();
        let halloween = new Date(currentYear, 9, 31, 0, 0, 0);

        if (now > halloween) {
            halloween = new Date(currentYear + 1, 9, 31, 0, 0, 0);
        }

        const diff = Math.max(0, halloween - now);
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        const daysEl = document.getElementById('countdownDays');
        const hoursEl = document.getElementById('countdownHours');
        const minutesEl = document.getElementById('countdownMinutes');
        const secondsEl = document.getElementById('countdownSeconds');

        if (daysEl) daysEl.textContent = String(days).padStart(2, '0');
        if (hoursEl) hoursEl.textContent = String(hours).padStart(2, '0');
        if (minutesEl) minutesEl.textContent = String(minutes).padStart(2, '0');
        if (secondsEl) secondsEl.textContent = String(seconds).padStart(2, '0');
    }

    // ============================================
    // YOUTUBE PLAYER
    // ============================================
    function ensureYouTubeIframeApi() {
        if (ytApiLoaded) return Promise.resolve();

        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = "https://www.youtube.com/iframe_api";
            script.async = true;
            script.onload = () => resolve();
            script.onerror = () => reject(new Error('No se pudo cargar la API de YouTube'));
            document.body.appendChild(script);
            ytApiLoaded = true;
        });
    }

    function onYouTubeIframeAPIReady() {
        console.log('YouTube IFrame API lista');
    }

    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

    function createPlayer() {
        if (player) return;

        player = new YT.Player('player', {
            width: '100%',
            height: '100%',
            playerVars: { autoplay: 1, controls: 1, rel: 0, modestbranding: 1 },
            events: {
                onReady: () => console.log('Player listo'),
                onError: (e) => console.error('YouTube player error:', e)
            }
        });
    }

    function getRandomVideoId() {
        if (!channelVideoIds || channelVideoIds.length === 0) return null;
        return channelVideoIds[Math.floor(Math.random() * channelVideoIds.length)];
    }

    async function playRandomVideo() {
        const vid = getRandomVideoId();

        if (!vid) {
            console.error('No hay videos disponibles');
            alert('No se encontraron videos. Verifica la configuración de la API.');
            return;
        }

        try {
            await ensureYouTubeIframeApi();

            // Esperar a que YT esté disponible
            let attempts = 0;
            while (typeof YT === 'undefined' && attempts < 20) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }

            if (typeof YT !== 'undefined' && YT.Player) {
                if (!player) createPlayer();

                // Esperar a que el player esté listo
                attempts = 0;
                while (!player.loadVideoById && attempts < 20) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }

                if (player.loadVideoById) {
                    player.loadVideoById(vid);
                } else {
                    throw new Error('Player no está listo');
                }
            } else {
                throw new Error('YT no está disponible');
            }

            // Transición del libro al video
            showVideoSection();
        } catch (err) {
            console.error('Error al reproducir video:', err);

            // Fallback: usar iframe directo
            const iframe = document.createElement('iframe');
            iframe.width = '100%';
            iframe.height = '100%';
            iframe.src = `https://www.youtube.com/embed/${vid}?autoplay=1&rel=0&modestbranding=1`;
            iframe.frameBorder = '0';
            iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
            iframe.allowFullscreen = true;

            const playerDiv = document.getElementById('player');
            playerDiv.innerHTML = '';
            playerDiv.appendChild(iframe);

            // Transición del libro al video
            showVideoSection();
        }
    }

    function showVideoSection() {
        const bookSection = document.getElementById('bookSection');
        const videoSection = document.getElementById('videoSection');

        // Ocultar libro con animación
        bookSection.classList.add('hiding');

        setTimeout(() => {
            bookSection.style.display = 'none';
            videoSection.classList.add('active');
            videoSection.setAttribute('aria-hidden', 'false');
        }, 500);
    }

    function showBookSection() {
        const bookSection = document.getElementById('bookSection');
        const videoSection = document.getElementById('videoSection');

        // Ocultar video
        videoSection.classList.remove('active');
        videoSection.setAttribute('aria-hidden', 'true');

        // Mostrar libro con animación
        bookSection.style.display = 'block';
        setTimeout(() => {
            bookSection.classList.remove('hiding');
        }, 50);

        // Detener player
        if (player && player.stopVideo) {
            try {
                player.stopVideo();
            } catch (e) {
                console.warn('Error al detener player:', e);
            }
        } else {
            const playerDiv = document.getElementById('player');
            if (playerDiv) playerDiv.innerHTML = '';
        }
    }

    // ============================================
    // INICIALIZACIÓN
    // ============================================
    function init() {
        console.log('Inicializando aplicación...');

        // Crear partículas de fondo
        createParticles();

        // Año en footer
        const yearEl = document.getElementById('year');
        if (yearEl) yearEl.textContent = new Date().getFullYear();

        // Iniciar contador
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Elementos
        const ctaButton = document.getElementById('ctaButton');
        const anotherVideoBtn = document.getElementById('anotherVideoBtn');
        const backToStartBtn = document.getElementById('backToStartBtn');

        if (!ctaButton || !anotherVideoBtn || !backToStartBtn) {
            console.error('No se encontraron todos los elementos necesarios');
            return;
        }

        // Event: CTA principal
        ctaButton.addEventListener('click', async (e) => {
            e.stopPropagation();
            console.log('CTA clicked');
            ctaButton.setAttribute('aria-pressed', 'true');
            ctaButton.disabled = true;
            const originalText = ctaButton.textContent;
            ctaButton.textContent = '⏳ Cargando...';

            try {
                // Cargar videos si no están cargados
                if (channelVideoIds.length === 0) {
                    console.log('Cargando videos desde /api/videos...');
                    const response = await fetch('/api/videos');

                    if (response.ok) {
                        const data = await response.json();
                        console.log('Respuesta de API:', data);

                        if (data.videoIds && data.videoIds.length > 0) {
                            channelVideoIds = data.videoIds;
                            console.log(`✓ Cargados ${channelVideoIds.length} videos`);
                        } else {
                            console.warn('La API no devolvió videos');
                        }
                    } else {
                        const errorText = await response.text();
                        console.error('Error al cargar videos:', response.status, errorText);
                    }
                }

                // Reproducir video
                await playRandomVideo();
            } catch (err) {
                console.error('Error en CTA:', err);
                alert('Hubo un error al cargar los videos. Revisa la consola del navegador.');
                ctaButton.disabled = false;
                ctaButton.textContent = originalText;
                ctaButton.setAttribute('aria-pressed', 'false');
            }
        });

        // Event: Otro video
        anotherVideoBtn.addEventListener('click', () => {
            console.log('Otro video clicked');
            playRandomVideo();
        });

        // Event: Volver al inicio
        backToStartBtn.addEventListener('click', () => {
            console.log('Volver al inicio clicked');
            showBookSection();
        });

        console.log('✓ Aplicación inicializada correctamente');
    }

    // Ejecutar cuando el DOM esté listo
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
    </script>
</body>
</html>
